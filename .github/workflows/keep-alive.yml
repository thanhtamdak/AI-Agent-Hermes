name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Start or Ping Codespace
        env:
          GH_TOKEN: ${{ secrets.CS_TOKEN }}
        run: |
          CS_NAME=$(gh codespace list --json name,repository -q '.[] | select(.repository | endswith("AI-Agent-Hermes")) | .name' | head -n 1)
          if [ -n "$CS_NAME" ]; then
            echo "Đang đánh thức Codespace: $CS_NAME"
            gh codespace ssh -c "$CS_NAME" -- "pgrep -f '9router' > /dev/null || nohup 9router > ~/.9router.log 2>&1 & sleep 2; pgrep -f 'hermes gateway' > /dev/null || nohup ~/.local/bin/hermes gateway > ~/.hermes-gateway.log 2>&1 &"
          else
            echo "Không tìm thấy Codespace phù hợp."
          fi
